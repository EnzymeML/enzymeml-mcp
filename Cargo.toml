[package]
name = "enzymeml-mcp"
version = "0.1.0"
edition = "2024"
description = "The EnzymeML MCP Server"
license = "MIT"
repository = "https://github.com/EnzymeML/enzymeml-mcp"
documentation = "https://docs.rs/enzymeml-mcp"


[dependencies]
rmcp = { version = "0.13.0", features = ["server", "transport-io"] }
enzymeml = { version = "0.1.3", default-features = false }
tokio = { version = "1.49.0", features = ["full"] }
schemars = "1.2.0"
serde = "1.0.228"
serde_json = "1.0.149"
anyhow = "1.0.100"
toon-format = "0.4.1"
reqwest = { version = "0.13.1", features = ["json", "gzip", "form", "brotli"] }
urlencoding = "2.1"
futures = "0.3.31"
quill = { version = "0.2.0", features = ["png"] }
base64 = "0.22.1"
meval = "0.2.0"

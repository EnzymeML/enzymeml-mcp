[package]
name = "enzymeml-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "0.13.0", features = ["server", "transport-io"] }
enzymeml = { version = "0.1.3", git = "https://github.com/EnzymeML/enzymeml-rs.git", branch = "master" }
tokio = { version = "1.49.0", features = ["full"] }
schemars = "1.2.0"
serde = "1.0.228"
serde_json = "1.0.149"
anyhow = "1.0.100"
toon-format = "0.4.1"
sparesults = "0.3.1"
reqwest = { version = "0.13.1", features = ["json", "gzip", "form", "brotli"] }
urlencoding = "2.1"
flate2 = "1.0"
futures = "0.3.31"
quill = { version = "0.2.0", features = ["png"] }
base64 = "0.22.1"
regex = "1.12.2"
meval = "0.2.0"
ndarray = "^0.15.6"
shh = "1.0.1"

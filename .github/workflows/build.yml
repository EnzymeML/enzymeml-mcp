name: Build

on:
    push:
    workflow_dispatch:
env:
    CARGO_TERM_COLOR: always
jobs:
    build:
        name: Build on ${{ matrix.os }}
        timeout-minutes: 120
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                include:
                    - os: ubuntu-latest
                      artifact_name: enzymeml-mcp
                      asset_name: enzymeml-mcp
                    - os: windows-latest
                      artifact_name: enzymeml-mcp.exe
                      asset_name: enzymeml-mcp
                    - os: macos-latest
                      artifact_name: enzymeml-mcp
                      asset_name: enzymeml-mcp

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Build binary
              uses: actions-rs/cargo@v1
              with:
                  command: build
                  args: --release --bin enzymeml-mcp
              continue-on-error: true

            - name: Rename binary (Windows)
              if: matrix.os == 'windows-latest'
              run: |
                  mv target/release/enzymeml-mcp.exe target/release/${{ matrix.artifact_name }}
              continue-on-error: true

            - name: Rename binary (Unix)
              if: matrix.os != 'windows-latest'
              run: |
                  mv target/release/enzymeml-mcp target/release/${{ matrix.artifact_name }}
              continue-on-error: true

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.asset_name }}
                  path: target/release/${{ matrix.artifact_name }}
                  if-no-files-found: warn
